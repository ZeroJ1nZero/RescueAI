[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fire-vision-experiments"
version = "0.1.0"
description = "Evidence-preserving offline RGB-D/IMU input validation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<13", "matplotlib>=3.6,<4", "rosbags==0.10.11"]

[project.scripts]
fire-vision = "fire_vision.cli:main"

[tool.setuptools.packages.find]
include = ["fire_vision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
